include file("generated.conveyor.conf")

include file("extract-native-libraries.conf")

app {
  compression-level = high
  contact-email = "support@crosspaste.com"
  license = "AGPL-3.0-or-later"
  display-name = "CrossPaste"
  rdns-name = "com.crosspaste"
  url-schemes = [ crosspaste ]
  vcs-url = "https://github.com/CrossPaste/crosspaste-desktop"

  site {
    consistency-checks = warn

    # Serve updates from the OSS-backed DCDN domain (global acceleration) so
    # update checks and downloads work from mainland China, where GitHub is
    # often unreachable (#4558). Release CI mirrors the full site to this
    # prefix; GitHub Releases stays as archive and website download source.
    base-url = "https://oss.crosspaste.com/site"
  }

  jvm {
    mac.amd64.inputs += "app/jbr/jbrsdk-21.0.9-osx-x64-b1163.94.tar.gz"
    mac.aarch64.inputs += "app/jbr/jbrsdk-21.0.9-osx-aarch64-b1163.94.tar.gz"
    windows.amd64.inputs += "app/jbr/jbrsdk-21.0.9-windows-x64-b1163.94.tar.gz"
    linux.amd64.inputs += "app/jbr/jbrsdk-21.0.9-linux-x64-b1163.94.tar.gz"
    linux.aarch64.inputs += "app/jbr/jbrsdk-21.0.9-linux-aarch64-b1163.94.tar.gz"
  }

  // OpenSSL libcrypto for the pairing v3 SPAKE2 backend, pinned in
  // app/openssl.yaml and produced by `./gradlew app:prepareOpenSslLibs`.
  // Thin jars so extract-native-libraries places the library in the JVM lib
  // directory and signs it (same pipeline as the skiko/tesseract jars).
  mac.aarch64.inputs += "app/openssl/crosspaste-libcrypto-macos-arm64.jar"
  mac.amd64.inputs += "app/openssl/crosspaste-libcrypto-macos-x64.jar"
  windows.amd64.inputs += "app/openssl/crosspaste-libcrypto-windows-x64.jar"
  linux.amd64.inputs += "app/openssl/crosspaste-libcrypto-linux-x64.jar"
  linux.aarch64.inputs += "app/openssl/crosspaste-libcrypto-linux-arm64.jar"

  mac {
    bundle-extras += "app/script/mac_start.sh" -> "bin/start.sh"
    icons = "app/src/desktopMain/composeResources/drawable/crosspaste_mac.png"

    info-plist.CFBundleIdentifier = "com.crosspaste.mac"
    info-plist.LSMinimumSystemVersion = 14.0.0
    info-plist.LSUIElement = true
    updates = background
    sparkle-options.SUScheduledCheckInterval = 0
  }

  windows {
    inputs += "app/script/win_start.bat" -> "bin/start.bat"
    icons = "app/src/desktopMain/composeResources/drawable/crosspaste.png"
    updates = {
      launch-check-frequency = 1
      block-start = false
      automatic-updates = true
    }
  }

  linux {
    debian.distribution.name = jammy

    desktop-file."Desktop Entry".Categories = "Utility;"

    install-path = /usr/lib/crosspaste

    icons = "app/src/desktopMain/composeResources/drawable/crosspaste.png"

    root-inputs += "app/script/linux_start.sh" -> "/usr/lib/crosspaste/bin/start.sh"
  }
}
conveyor.compatibility-level = 19
