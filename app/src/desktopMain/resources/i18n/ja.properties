desktop_guide_0=🎉 CrossPaste へようこそ！\n🔗 デバイス間でコピー＆ペーストするには、まずデバイスを接続してください。\n上の「デバイス」タブを開いて近くのデバイスを追加し、ペアリングコードを確認すれば、どこでもペーストできます。
desktop_guide_1=✨ テキスト、リンク、カラー、HTML、リッチテキスト、画像、ファイル（フォルダを含む）に対応しています。1つの項目に複数のタイプを含められますが、表示されるのは主なタイプだけです。
desktop_guide_2=🔎 コピーした内容はすべて自動的にここに保存され、時間の経過とともにクリーンアップされます。\n⭐ 残しておきたいものは、右側の星をタップすれば削除されません。
desktop_guide_3=🔐 データはあなたの手元に残ります。\nCrossPaste にサーバーはなく、すべてローカルネットワーク内で同期されます。\n信頼できないネットワークでは、先に「設定 > ネットワーク」で「暗号化同期」をオンにしてください。
desktop_guide_4=💡 CrossPaste は完全にオープンソースです。コードを読んだり、問題を報告したり、開発に参加したりしてみてください！
