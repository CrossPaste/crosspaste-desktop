desktop_guide_0=🎉 歡迎使用 CrossPaste！\n🔗 要跨裝置複製貼上，先連線裝置。\n開啟上方的「裝置」分頁，新增附近的裝置並確認配對碼，之後就能隨處貼上。
desktop_guide_1=✨ 支援文字、連結、顏色、HTML、RTF、圖片和檔案（包括資料夾）。一個項目可以同時包含多種類型，只以主類型呈現。
desktop_guide_2=🔎 複製的內容都會自動記錄在這裡，並在適當的時候自動清理。\n⭐ 想保留？點右側的收藏，就不會被清理。
desktop_guide_3=🔐 資料只屬於你。\nCrossPaste 沒有伺服器，所有同步都在區域網路內完成。\n在不可信的網路上同步前，先在「設定 > 網路」中開啟「加密同步」。
desktop_guide_4=💡 CrossPaste 完全開源。歡迎閱讀原始碼、回報問題或參與貢獻！
