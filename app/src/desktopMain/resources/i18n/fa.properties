desktop_guide_0=🎉 به CrossPaste خوش آمدید!\n🔗 برای کپی و جای‌گذاری میان دستگاه‌ها، ابتدا دستگاه‌های خود را متصل کنید.\nزبانهٔ «دستگاه‌ها» را در بالا باز کنید، یک دستگاه نزدیک را اضافه کنید و کد جفت‌سازی را تأیید کنید. سپس در هر جایی جای‌گذاری کنید.
desktop_guide_1=✨ متن، پیوندها، رنگ‌ها، HTML، متن غنی، تصاویر و فایل‌ها (شامل پوشه‌ها) همگی پشتیبانی می‌شوند. یک مورد می‌تواند هم‌زمان چند نوع از این‌ها را در بر داشته باشد؛ فقط نوع اصلی نمایش داده می‌شود.
desktop_guide_2=🔎 هر چیزی که کپی می‌کنید به‌طور خودکار اینجا ذخیره و به مرور زمان پاک‌سازی می‌شود.\n⭐ می‌خواهید چیزی را نگه دارید؟ روی ستارهٔ سمت راست بزنید تا پاک نشود.
desktop_guide_3=🔐 داده‌های شما نزد خودتان می‌ماند.\nCrossPaste سروری ندارد. همه‌چیز در شبکهٔ محلی شما همگام‌سازی می‌شود.\nدر شبکه‌های غیرقابل‌اعتماد، ابتدا «همگام‌سازی رمزگذاری‌شده» را در تنظیمات > شبکه روشن کنید.
desktop_guide_4=💡 CrossPaste کاملاً متن‌باز است. کد را بخوانید، مشکلات را گزارش کنید یا مشارکت کنید!
