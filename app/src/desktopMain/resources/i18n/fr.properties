desktop_guide_0=🎉 Bienvenue dans CrossPaste !\n🔗 Pour copier et coller entre vos appareils, connectez-les d'abord.\nOuvrez l'onglet Appareils ci-dessus, ajoutez un appareil à proximité et confirmez le code de jumelage. Vous pourrez ensuite coller où vous voulez.
desktop_guide_1=✨ Texte, liens, couleurs, HTML, texte enrichi, images et fichiers (dossiers compris) sont tous pris en charge. Un élément peut contenir plusieurs de ces types à la fois ; seul le type principal est affiché.
desktop_guide_2=🔎 Tout ce que vous copiez est enregistré ici automatiquement et nettoyé au fil du temps.\n⭐ Vous voulez garder un élément ? Touchez l'étoile à droite et il ne sera pas effacé.
desktop_guide_3=🔐 Vos données restent chez vous.\nCrossPaste n'a pas de serveur. Tout se synchronise au sein de votre réseau local.\nSur un réseau non fiable, activez d'abord « Synchronisation chiffrée » dans Paramètres > Réseau.
desktop_guide_4=💡 CrossPaste est entièrement open source. Lisez le code, signalez des problèmes ou contribuez !
