desktop_guide_0=🎉 欢迎使用 CrossPaste！\n🔗 要跨设备复制粘贴，先连接设备。\n打开上方的“设备”页，添加附近的设备并确认配对码，之后就能随处粘贴。
desktop_guide_1=✨ 支持文本、链接、颜色、HTML、富文本、图片和文件（包括文件夹）。一条记录可以同时包含多种类型，只按主类型呈现。
desktop_guide_2=🔎 复制的内容都会自动记录在这里，并在适当的时候自动清理。\n⭐ 想保留？点右侧的收藏，就不会被清理。
desktop_guide_3=🔐 数据只属于你。\nCrossPaste 没有服务器，所有同步都在局域网内完成，\n端到端加密让不可信的网络也同样安全。
desktop_guide_4=💡 CrossPaste 完全开源。欢迎阅读源码、提交 issue 或参与贡献！
