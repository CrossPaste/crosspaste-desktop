desktop_guide_0=🎉 CrossPaste에 오신 것을 환영합니다!\n🔗 기기 간에 복사하고 붙여넣으려면 먼저 기기를 연결하세요.\n위의 기기 탭을 열어 근처 기기를 추가하고 페어링 코드를 확인하세요. 그러면 어디서나 붙여넣을 수 있습니다.
desktop_guide_1=✨ 텍스트, 링크, 색상, HTML, 서식 있는 텍스트, 이미지, 파일(폴더 포함)을 모두 지원합니다. 한 항목에 여러 유형이 함께 들어 있을 수 있으며, 주 유형만 표시됩니다.
desktop_guide_2=🔎 복사한 내용은 모두 여기에 자동으로 저장되고 시간이 지나면 정리됩니다.\n⭐ 보관하고 싶은 항목이 있나요? 오른쪽의 별표를 누르면 지워지지 않습니다.
desktop_guide_3=🔐 데이터는 사용자에게만 있습니다.\nCrossPaste에는 서버가 없습니다. 모든 동기화는 로컬 네트워크 안에서 이루어집니다.\n신뢰할 수 없는 네트워크에서는 먼저 설정 > 네트워크에서 암호화 동기화를 켜세요.
desktop_guide_4=💡 CrossPaste는 완전한 오픈 소스입니다. 코드를 읽고, 문제를 신고하고, 기여해 주세요!
