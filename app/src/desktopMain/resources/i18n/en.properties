desktop_guide_0=🎉 Welcome to CrossPaste!\n🔗 To copy and paste across devices, connect your devices first.\nOpen the Devices tab above, add a nearby device, and confirm the pairing code. Then paste anywhere.
desktop_guide_1=✨ Text, links, colors, HTML, rich text, images, and files (including folders) are all supported. An item can hold several of these at once; only the main type is shown.
desktop_guide_2=🔎 Everything you copy is saved here automatically and cleaned up over time.\n⭐ Want to keep something? Tap the star on the right and it won't be cleared.
desktop_guide_3=🔐 Your data stays with you.\nCrossPaste has no server. Everything syncs within your local network.\nOn untrusted networks, turn on Encrypted sync under Settings > Network first.
desktop_guide_4=💡 CrossPaste is fully open source. Read the code, report issues, or contribute!
