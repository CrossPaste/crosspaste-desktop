desktop_guide_0=🎉 ¡Bienvenido a CrossPaste!\n🔗 Para copiar y pegar entre dispositivos, primero conecta tus dispositivos.\nAbre la pestaña Dispositivos de arriba, añade un dispositivo cercano y confirma el código de emparejamiento. Después podrás pegar en cualquier lugar.
desktop_guide_1=✨ Se admiten texto, enlaces, colores, HTML, texto enriquecido, imágenes y archivos (incluidas carpetas). Un elemento puede contener varios de estos tipos a la vez; solo se muestra el tipo principal.
desktop_guide_2=🔎 Todo lo que copias se guarda aquí automáticamente y se limpia con el tiempo.\n⭐ ¿Quieres conservar algo? Toca la estrella de la derecha y no se eliminará.
desktop_guide_3=🔐 Tus datos se quedan contigo.\nCrossPaste no tiene servidor. Todo se sincroniza dentro de tu red local.\nEn redes que no sean de confianza, activa primero Sincronización cifrada en Ajustes > Red.
desktop_guide_4=💡 CrossPaste es totalmente de código abierto. ¡Revisa el código, informa de problemas o contribuye!
