desktop_guide_0=🎉 Bem-vindo ao CrossPaste!\n🔗 Para copiar e colar entre dispositivos, primeiro conecte seus dispositivos.\nAbra a aba Dispositivos acima, adicione um dispositivo próximo e confirme o código de pareamento. Depois, cole em qualquer lugar.
desktop_guide_1=✨ Texto, links, cores, HTML, texto formatado, imagens e arquivos (incluindo pastas) são todos suportados. Um item pode conter vários desses tipos ao mesmo tempo; apenas o tipo principal é exibido.
desktop_guide_2=🔎 Tudo o que você copia é salvo aqui automaticamente e limpo com o tempo.\n⭐ Quer manter algo? Toque na estrela à direita e o item não será removido.
desktop_guide_3=🔐 Seus dados ficam com você.\nO CrossPaste não tem servidor. Tudo é sincronizado dentro da sua rede local.\nEm redes não confiáveis, ative primeiro a Sincronização criptografada em Configurações > Rede.
desktop_guide_4=💡 O CrossPaste é totalmente de código aberto. Leia o código, relate problemas ou contribua!
