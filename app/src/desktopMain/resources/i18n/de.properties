desktop_guide_0=🎉 Willkommen bei CrossPaste!\n🔗 Um geräteübergreifend zu kopieren und einzufügen, verbinden Sie zuerst Ihre Geräte.\nÖffnen Sie oben den Tab „Geräte“, fügen Sie ein Gerät in der Nähe hinzu und bestätigen Sie den Kopplungscode. Danach können Sie überall einfügen.
desktop_guide_1=✨ Text, Links, Farben, HTML, Rich Text, Bilder und Dateien (einschließlich Ordner) werden unterstützt. Ein Eintrag kann mehrere dieser Typen zugleich enthalten; angezeigt wird nur der Haupttyp.
desktop_guide_2=🔎 Alles, was Sie kopieren, wird hier automatisch gespeichert und mit der Zeit bereinigt.\n⭐ Möchten Sie etwas behalten? Tippen Sie rechts auf den Stern, dann wird es nicht gelöscht.
desktop_guide_3=🔐 Ihre Daten bleiben bei Ihnen.\nCrossPaste hat keinen Server. Alles wird innerhalb Ihres lokalen Netzwerks synchronisiert.\nIn nicht vertrauenswürdigen Netzwerken aktivieren Sie zuerst „Verschlüsselte Synchronisierung“ unter Einstellungen > Netzwerk.
desktop_guide_4=💡 CrossPaste ist vollständig Open Source. Lesen Sie den Code, melden Sie Probleme oder tragen Sie bei!
