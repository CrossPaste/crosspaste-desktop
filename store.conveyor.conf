// Microsoft Store build, driven by build_windows_misx.sh. The Store package
// must ship the same CLI and `crosspaste` / `crosspaste-cli` execution aliases
// as the site MSIX (#5190), so it layers cli.conveyor.conf on top of the
// gitignored local.conveyor.conf (Store credentials; never commit it). Leaves
// app.revision unset on purpose: the Store requires the x.y.z.0 version.
include required("local.conveyor.conf")
include required("cli.conveyor.conf")
