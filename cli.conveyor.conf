// Ships the Kotlin/Native CLI binary inside every desktop package (P3 of the
// CLI completion plan). Deliberately NOT included from conveyor.conf: a plain
// local `conveyor make app` must keep working without pre-building the CLI.
// Consumers: build.conveyor.conf (release CI), store.conveyor.conf (the
// Microsoft Store build) and the beta workflow's generated conf. Before
// packaging, populate cli/dist/ via the Gradle tasks:
//   ./gradlew :cli:assembleDist          (host-buildable targets)
//   ./gradlew :cli:assembleDist<Target>  (single target)
//
// Design decision D6: the CLI is application payload, imported with plain
// per-arch `inputs` like any other app file, so it reaches every channel
// (deb, tarball, AppImage, mac zip, win zip, MSIX) through one mechanism.
// It lands in the JVM payload area (linux lib/app/bin/, windows app\bin\,
// mac Contents/Resources/bin/) — an address users never see. The user-facing
// entry point is PATH, wired per channel: the deb symlink and MSIX aliases
// below (install time), and on macOS a first-launch symlink prompt in the
// app.
app {
  mac.aarch64.inputs += "cli/dist/macosArm64/crosspaste-cli" -> "bin/crosspaste-cli"
  mac.amd64.inputs += "cli/dist/macosX64/crosspaste-cli" -> "bin/crosspaste-cli"

  windows.amd64.inputs += "cli/dist/mingwX64/crosspaste-cli.exe" -> "bin/crosspaste-cli.exe"

  // The terminal command `crosspaste` is the CLI on every platform (design
  // decision D4). On Windows the MSIX package wires it through app execution
  // aliases, which needs the whole AppxManifest.xml to be overridden:
  //
  // - Conveyor's built-in template always emits an alias `<fsname>.exe`
  //   (= crosspaste.exe) pointing at updatecheck.exe (GUI launch) and has no
  //   config key to rename or remove it (hydraulic-software/conveyor#190).
  // - Windows accepts only ONE windows.appExecutionAlias extension per
  //   <Application> (0x80080204 on late-2025 Windows 11 builds, #5189), and
  //   the alias target exe is a per-extension attribute, so the CLI aliases
  //   must live in a second, hidden <Application>.
  // - `extensions-xml` can only add to the main Application; it cannot drop
  //   the GUI alias. `content` is the only key that can.
  //
  // So the manifest below is Conveyor 22.3's generated manifest, verbatim
  // (taken from an unmodified `conveyor make windows-msix` build), with one
  // change: the main `Crosspaste` Application keeps the protocol handler but
  // declares no alias, and a hidden `CrosspasteCli` Application
  // (AppListEntry="none") declares one alias extension with two aliases,
  // `crosspaste.exe` and the historical `crosspaste-cli.exe`. Both run
  // app\bin\crosspaste-cli.exe; the GUI stays reachable via the Start menu
  // tile and the crosspaste:// protocol. Same layout as python/pymanager's
  // appxmanifest.xml (one Application per aliased exe).
  //
  // Hard-coded values that Conveyor normally derives (keep in sync):
  // - Identity Name / Publisher come from app.windows.store.identity-name and
  //   .publisher (ShenzhenCompileFutureTech.CrossPaste, the Partner Center
  //   publisher GUID). They are the package family name: changing either
  //   turns an update into a parallel install.
  // - Version is ${app.version}.${app.revision}, exactly like Conveyor's
  //   version-quad (the Store build leaves app.revision unset, so it keeps
  //   its required x.y.z.0; site builds get the CI revision).
  // - MinVersion / MaxVersionTested mirror Conveyor's msix defaults
  //   (max-version-tested = 25H2). Conveyor bumps the latter in upgrades.
  //
  // After every Conveyor upgrade: build once with this `content` key removed
  // (`extensions-xml` is ignored while `content` is set), extract
  // AppxManifest.xml from the resulting .msix (it is a zip) and diff it
  // against this block; port any template change (new namespaces,
  // MaxVersionTested, Properties, escape-hatch extensions, ...) and keep the
  // two-Application alias layout. Conveyor's schema validation still runs on
  // this content, so a structural mistake fails the build, but a silently
  // stale MaxVersionTested or a missing new extension would not.
  windows.manifests.msix.content = """
<?xml version="1.0" encoding="utf-8"?>
<Package IgnorableNamespaces="rescap6 virtualization desktop6 uap7 uap8" xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:com="http://schemas.microsoft.com/appx/manifest/com/windows10" xmlns:com2="http://schemas.microsoft.com/appx/manifest/com/windows10/2" xmlns:desktop="http://schemas.microsoft.com/appx/manifest/desktop/windows10" xmlns:desktop2="http://schemas.microsoft.com/appx/manifest/desktop/windows10/2" xmlns:desktop3="http://schemas.microsoft.com/appx/manifest/desktop/windows10/3" xmlns:desktop4="http://schemas.microsoft.com/appx/manifest/desktop/windows10/4" xmlns:desktop5="http://schemas.microsoft.com/appx/manifest/desktop/windows10/5" xmlns:desktop6="http://schemas.microsoft.com/appx/manifest/desktop/windows10/6" xmlns:desktop7="http://schemas.microsoft.com/appx/manifest/desktop/windows10/7" xmlns:desktop8="http://schemas.microsoft.com/appx/manifest/desktop/windows10/8" xmlns:desktop9="http://schemas.microsoft.com/appx/manifest/desktop/windows10/9" xmlns:f2="http://schemas.microsoft.com/appx/manifest/foundation/windows10/2" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" xmlns:rescap2="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities/2" xmlns:rescap3="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities/3" xmlns:rescap4="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities/4" xmlns:rescap6="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities/6" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:uap2="http://schemas.microsoft.com/appx/manifest/uap/windows10/2" xmlns:uap3="http://schemas.microsoft.com/appx/manifest/uap/windows10/3" xmlns:uap4="http://schemas.microsoft.com/appx/manifest/uap/windows10/4" xmlns:uap5="http://schemas.microsoft.com/appx/manifest/uap/windows10/5" xmlns:uap6="http://schemas.microsoft.com/appx/manifest/uap/windows10/6" xmlns:uap7="http://schemas.microsoft.com/appx/manifest/uap/windows10/7" xmlns:uap8="http://schemas.microsoft.com/appx/manifest/uap/windows10/8" xmlns:virtualization="http://schemas.microsoft.com/appx/manifest/virtualization/windows10">
  <Identity Name="ShenzhenCompileFutureTech.CrossPaste" Version=""""${app.version}"."${app.revision}""""
            Publisher="CN=85A51CE1-8911-4CD3-94A0-F98F4E742FED" ProcessorArchitecture="x64" />
  <Properties>
    <DisplayName>CrossPaste</DisplayName>
    <PublisherDisplayName>Shenzhen Compile Future Technology Co., Ltd</PublisherDisplayName>
    <Logo>ConveyorMsixResources/StoreLogo.png</Logo>
  </Properties>
  <Resources>
    <Resource Language="en" />
  </Resources>
  <Applications>
    <Application Id="Crosspaste" EntryPoint="Windows.FullTrustApplication" Executable="updatecheck.exe">
      <uap:VisualElements AppListEntry="default" DisplayName="CrossPaste" Description="Application" BackgroundColor="transparent" Square150x150Logo="ConveyorMsixResources/Square150x150Logo.png" Square44x44Logo="ConveyorMsixResources/Square44x44Logo.png"/>
      <uap7:Properties><uap8:ActiveCodePage>UTF-8</uap8:ActiveCodePage></uap7:Properties>
      <Extensions>
        <uap:Extension Category="windows.protocol">
          <uap:Protocol Name="crosspaste"><uap:DisplayName>CrossPaste</uap:DisplayName></uap:Protocol>
        </uap:Extension>
      </Extensions>
    </Application>
    <Application Id="CrosspasteCli" EntryPoint="Windows.FullTrustApplication" Executable="app\bin\crosspaste-cli.exe">
      <uap:VisualElements AppListEntry="none" DisplayName="CrossPaste CLI" Description="CrossPaste command line" BackgroundColor="transparent" Square150x150Logo="ConveyorMsixResources/Square150x150Logo.png" Square44x44Logo="ConveyorMsixResources/Square44x44Logo.png"/>
      <uap7:Properties><uap8:ActiveCodePage>UTF-8</uap8:ActiveCodePage></uap7:Properties>
      <Extensions>
        <uap3:Extension Category="windows.appExecutionAlias" Executable="app\bin\crosspaste-cli.exe" EntryPoint="Windows.FullTrustApplication">
          <uap3:AppExecutionAlias>
            <uap8:ExecutionAlias Alias="crosspaste.exe"/>
            <uap8:ExecutionAlias Alias="crosspaste-cli.exe"/>
          </uap3:AppExecutionAlias>
        </uap3:Extension>
      </Extensions>
    </Application>
  </Applications>
  <Capabilities>
    <rescap:Capability Name="runFullTrust" />
  </Capabilities>
  <Dependencies>
    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26200.7623" />
  </Dependencies>
</Package>
"""

  linux.amd64.inputs += "cli/dist/linuxX64/crosspaste-cli" -> "bin/crosspaste-cli"
  linux.aarch64.inputs += "cli/dist/linuxArm64/crosspaste-cli" -> "bin/crosspaste-cli"

  // Re-declaring the default launcher symlink's link path overrides it, so
  // /usr/bin/crosspaste points at the CLI; the GUI stays reachable via the
  // desktop entry, whose Exec uses the absolute launcher path.
  linux.symlinks += "/usr/bin/crosspaste" -> "/usr/lib/crosspaste/lib/app/bin/crosspaste-cli"
}
