# Apple targets carry cinterops, so KGP can't cross-compile their klibs from a
# non-mac host and warns once per target instead. Opt out for this project only
# (core/shared keep cross-compiling Apple klibs on Linux CI); assembleDist
# already skips Apple targets on non-mac hosts. Must live in gradle.properties:
# KGP reads it before the build script body runs.
kotlin.native.enableKlibsCrossCompilation=false
