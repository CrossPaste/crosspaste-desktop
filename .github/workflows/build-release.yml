name: "Build Package"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'

jobs:
  check-dylib-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-hit-x86: ${{ steps.cache-check-x86.outputs.cache-hit }}
      cache-hit-aarch64: ${{ steps.cache-check-aarch64.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6

      - name: check-dylib-cache-x86
        id: cache-check-x86
        uses: actions/cache/restore@v5
        with:
          path: ./app/dylib/darwin-x86-64/libMacosApi.dylib
          key: mac-dylib-darwin-x86-64-${{ hashFiles('**/*.swift', '**/dylib-mini-sys.properties') }}
          enableCrossOsArchive: true

      - name: check-dylib-cache-aarch64
        id: cache-check-aarch64
        uses: actions/cache/restore@v5
        with:
          path: ./app/dylib/darwin-aarch64/libMacosApi.dylib
          key: mac-dylib-darwin-aarch64-${{ hashFiles('**/*.swift', '**/dylib-mini-sys.properties') }}
          enableCrossOsArchive: true

  build-macos:
    needs: [check-dylib-cache]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Build dylib for x86_64
        if: needs.check-dylib-cache.outputs.cache-hit-x86 != 'true'
        run: |
          mkdir -p app/dylib/darwin-x86-64
          swiftc -emit-library app/src/desktopMain/swift/MacosApi.swift -target x86_64-apple-macos10.15 -o app/dylib/darwin-x86-64/libMacosApi.dylib

      - name: Build dylib for arm64
        if: needs.check-dylib-cache.outputs.cache-hit-aarch64 != 'true'
        run: |
          mkdir -p app/dylib/darwin-aarch64
          swiftc -emit-library app/src/desktopMain/swift/MacosApi.swift -target arm64-apple-macos11 -o app/dylib/darwin-aarch64/libMacosApi.dylib

      - name: Save dylib to cache for x86_64
        if: needs.check-dylib-cache.outputs.cache-hit-x86 != 'true'
        uses: actions/cache/save@v5
        with:
          path: ./app/dylib/darwin-x86-64/libMacosApi.dylib
          key: mac-dylib-darwin-x86-64-${{ hashFiles('**/*.swift', '**/dylib-mini-sys.properties') }}
          enableCrossOsArchive: true

      - name: Save dylib to cache for arm64
        if: needs.check-dylib-cache.outputs.cache-hit-aarch64 != 'true'
        uses: actions/cache/save@v5
        with:
          path: ./app/dylib/darwin-aarch64/libMacosApi.dylib
          key: mac-dylib-darwin-aarch64-${{ hashFiles('**/*.swift', '**/dylib-mini-sys.properties') }}
          enableCrossOsArchive: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*',
            '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # Apple targets can only be compiled on a macOS host; the remaining CLI
      # targets are cross-compiled in build-ubuntu. The full version is taken
      # from the git tag because validateAndUpdateVersion.js only rewrites the
      # version file later, in build-ubuntu (an artifact is used instead of a
      # cache because the binaries change on every release).
      - name: Build CLI binaries (macOS targets)
        run: ./gradlew :cli:assembleDistMacosArm64 :cli:assembleDistMacosX64 "-PcliVersion=${GITHUB_REF_NAME}"

      - name: Upload macOS CLI binaries
        uses: actions/upload-artifact@v7
        with:
          name: cli-dist-macos
          path: cli/dist/
          if-no-files-found: error

  build-ubuntu:
    needs: [check-dylib-cache, build-macos]
    runs-on: ubuntu-latest
    env:
      APPLE_ASP: ${{ secrets.APPLE_ASP }}
      AUTH_KEY_FILE_PATH: ${{ github.workspace }}/AuthKey.p8
      BUILD_FULL_PLATFORM: true
      BUILD_MAIN_PATH: ${{ github.workspace }}/app/build/classes/kotlin/desktop/main
      GITHUB_REF: ${{ github.ref }}
      ISSUER_ID: ${{ secrets.ISSUER_ID }}
      KEY_ID: ${{ secrets.KEY_ID }}
      MAC_SIGNING_KEY_FILE_PATH: ${{ github.workspace }}/developerID_application.p12
      PRE_RELEASE: false
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
      WINDOWS_CLIENT_ID: ${{ secrets.WINDOWS_CLIENT_ID }}
      WINDOWS_CLIENT_SECRET: ${{ secrets.WINDOWS_CLIENT_SECRET }}
      WINDOWS_IDENTITY_NAME: ${{ secrets.WINDOWS_IDENTITY_NAME }}
      WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
      WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_PUBLISHER_DISPLAY_NAME }}
      WINDOWS_STORE_ID: ${{ secrets.WINDOWS_STORE_ID }}
      WINDOWS_TENANT_ID: ${{ secrets.WINDOWS_TENANT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # https://github.com/actions/runner-images/issues/2840
      - name: Clear unnecessary files to free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install semver fs-extra axios

      - name: Validate and update version
        run: node .github/scripts/validateAndUpdateVersion.js

      - name: Set Revision
        run: |
          CALCULATED_REVISION=$(git rev-list --count HEAD)
          if [ "$CALCULATED_REVISION" = "${{ env.REVISION }}" ]; then
            echo "Calculated revision matches the one in GitHub environment."
            echo -e "\nrevision=$CALCULATED_REVISION" >> app/src/desktopMain/resources/crosspaste-version.properties
            echo "Revision has been written to properties file."
          else
            echo "Error: Calculated revision ($CALCULATED_REVISION) does not match the one in GitHub environment (${{ env.REVISION }})."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Set up AppImageTool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*',
            '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

      - name: Cache Jetbrains Runtime JDK
        uses: actions/cache@v5
        with:
          path: ./app/jbr
          key: jbr-${{ hashFiles('**/jbr.yaml') }}

      - name: Cache OpenSSL libcrypto binaries
        uses: actions/cache@v5
        with:
          path: ./app/openssl
          key: openssl-${{ hashFiles('**/openssl.yaml') }}

      - name: Restore dylib cache for x86_64
        uses: actions/cache/restore@v5
        with:
          path: ./app/dylib/darwin-x86-64/libMacosApi.dylib
          key: mac-dylib-darwin-x86-64-${{ hashFiles('**/*.swift', '**/dylib-mini-sys.properties') }}
          enableCrossOsArchive: true

      - name: Restore dylib cache for aarch64
        uses: actions/cache/restore@v5
        with:
          path: ./app/dylib/darwin-aarch64/libMacosApi.dylib
          key: mac-dylib-darwin-aarch64-${{ hashFiles('**/*.swift', '**/dylib-mini-sys.properties') }}
          enableCrossOsArchive: true

      - name: Build with Gradle
        run: ./gradlew app:build -PintegrationTests

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Download macOS CLI binaries
        uses: actions/download-artifact@v8
        with:
          name: cli-dist-macos
          path: cli/dist/

      # GitHub artifacts drop the executable bit; restore it or the packaged
      # mac CLI would ship unexecutable.
      - name: Restore CLI executable permissions
        run: chmod +x cli/dist/*/crosspaste-cli

      # Same version source as the build-macos CLI step, so every platform's
      # CLI reports the identical full version by construction.
      - name: Build CLI binaries (Linux and Windows targets)
        run: >
          ./gradlew :cli:assembleDistLinuxX64 :cli:assembleDistLinuxArm64
          :cli:assembleDistMingwX64 "-PcliVersion=${GITHUB_REF_NAME}"

      - name: Check Dylib Files
        run: |
          BUILD_DIR=$(./gradlew app:properties | grep "buildDir:" | awk '{print $2}')

          DYLIB_PATH="$BUILD_DIR/classes/kotlin/desktop/main"

          echo "Looking for files in: $DYLIB_PATH"

          if [ -d "$DYLIB_PATH" ]; then
            echo "Directory exists, contents:"
            ls -la "$DYLIB_PATH"

            echo "Searching for .dylib files:"
            find "$DYLIB_PATH" -name "*.dylib" -type f
          else
            echo "Directory does not exist!"
          fi

      - name: Prepare OpenSSL libcrypto jars
        run: ./gradlew app:prepareOpenSslLibs

      - name: Prepare Dependency
        run: |
          ./gradlew -q writeConveyorConfig -PappEnv=PRODUCTION
          mv app/generated.conveyor.conf generated.conveyor.conf
          node ./.github/scripts/rewriteConveyorConf.js generated.conveyor.conf
          node ./.github/scripts/processJarFiles.js "tesseract-.*-macosx-arm64.jar" generated.conveyor.conf
          node ./.github/scripts/processJarFiles.js "tesseract-.*-macosx-x86_64.jar" generated.conveyor.conf

      - name: Check for duplicate JAR versions
        run: node ./.github/scripts/checkDuplicateJars.js generated.conveyor.conf

      - name: Prepare Conveyor
        run: |
          echo "${{ secrets.DEVELOPER_ID_APPLICATION }}" | base64 --decode > developerID_application.p12
          echo "${{ secrets.AUTH_KEY }}" | base64 --decode > AuthKey.p8

      - name: Conveyor build
        uses: hydraulic-software/conveyor/actions/build@v22.1
        with:
          command: make site
          extra_flags: -f build.conveyor.conf
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1

      # Snapshot the pure Conveyor site before later steps mutate output/
      # (AppImage/extension get added, CheckSum deletes icon.svg/download.html).
      # This copy is staged to a version-named OSS prefix; publishing it to the
      # live CDN-served site/ prefix is a separate human-gated workflow (#4629).
      - name: Stage update site for OSS mirror
        run: cp -r output update-site

      # Microsoft Store package. Partner Center requires the manifest Version
      # to be x.y.z.0 ("the app.revision number must be zero as the store
      # uses the revision number for its own purposes"), so the site MSIX
      # built above (Version x.y.z.<revision>) is rejected on upload. Build
      # only the MSIX again with app.revision forced to 0: the -K override
      # takes precedence over build.conveyor.conf's `revision = ${env.REVISION}`
      # (checked with `conveyor -Kapp.revision=0 -f build.conveyor.conf json`),
      # and everything else — inputs, Store identity, the cli.conveyor.conf
      # manifest with the CLI and its execution aliases — is identical to the
      # site package. The reused .conveyor cache makes this an incremental
      # build. The Conveyor action restores/installs only on its first use in
      # the job, so a second invocation is cheap.
      - name: Conveyor build (Microsoft Store MSIX)
        uses: hydraulic-software/conveyor/actions/build@v22.1
        with:
          command: make windows-msix --output-dir=output-store
          extra_flags: --cache-limit=40 -Kapp.revision=0 -f build.conveyor.conf
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1

      # Fail the release rather than ship a Store package that Partner Center
      # would reject (wrong Version) or that lost the CLI (#5190): the
      # manifest must carry Version x.y.z.0, app\bin\crosspaste-cli.exe and
      # both execution aliases. The verified file is then moved into output/
      # under an unambiguous name (the site MSIX is
      # crosspaste-<version>-<revision>.x64.msix) so it is uploaded to the
      # versioned OSS prefix and listed in checksum.txt for
      # scripts/publish-msstore.sh. It is deliberately NOT part of the update
      # site, which was snapshotted before this step.
      - name: Verify and stage Store MSIX
        run: |
          shopt -s nullglob
          files=(output-store/*.msix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one MSIX in output-store/, found: ${files[*]:-none}"
            exit 1
          fi
          # The <Identity> element spans several lines; flatten before matching.
          unzip -p "${files[0]}" AppxManifest.xml | tr '\n' ' ' > store-manifest.xml
          grep -o '<Identity [^>]*>' store-manifest.xml
          grep -q '<Identity [^>]* Version="${{ env.VERSION }}.0"' store-manifest.xml || { echo "Store manifest Version is not ${{ env.VERSION }}.0"; exit 1; }
          grep -q 'Executable="app\\bin\\crosspaste-cli.exe"' store-manifest.xml || { echo "Store manifest lacks the crosspaste-cli.exe Application"; exit 1; }
          grep -q 'Alias="crosspaste.exe"' store-manifest.xml || { echo "Store manifest lacks the crosspaste.exe execution alias"; exit 1; }
          grep -q 'Alias="crosspaste-cli.exe"' store-manifest.xml || { echo "Store manifest lacks the crosspaste-cli.exe execution alias"; exit 1; }
          # No grep -q here: an early exit would SIGPIPE unzip and trip pipefail.
          unzip -Z1 "${files[0]}" | grep -x 'app/bin/crosspaste-cli.exe' > /dev/null || { echo "Store MSIX does not contain app/bin/crosspaste-cli.exe"; exit 1; }
          mv "${files[0]}" "output/crosspaste-${{ env.VERSION }}-store.x64.msix"
          rm -rf output-store store-manifest.xml

      - name: Package AppImage
        run: |
          chmod +x ./.github/scripts/package_appimage.sh
          ./.github/scripts/package_appimage.sh

      # Repackage the Linux tarballs as EL9-compatible RPMs on the same runner,
      # after the update-site snapshot, so they land next to the other
      # packages in output/ (checksum.txt, the versioned OSS dir and the
      # GitHub Release). The RPMs are signed with, and embed the public half
      # of, the RPM_SIGNING_KEY repository secret: an ASCII-armored GPG secret
      # key without a passphrase, dedicated to this channel. Generate and
      # store it once with
      #   gpg --batch --pinentry-mode loopback --passphrase '' \
      #     --quick-generate-key 'CrossPaste <support@crosspaste.com>' rsa4096 sign never
      #   gpg --armor --export-secret-keys 'CrossPaste <support@crosspaste.com>' \
      #     | gh secret set RPM_SIGNING_KEY
      # and keep a backup of the secret key outside GitHub: rotating it
      # requires every RPM user to accept a new key. The matching public key
      # (gpg --armor --export) is written by the scripts into the packages
      # (/etc/pki/rpm-gpg/RPM-GPG-KEY-CrossPaste) and the repository root
      # (site/rpm/RPM-GPG-KEY-CrossPaste); nothing key-related is committed.
      - name: Package RPM (x86_64 and aarch64)
        run: |
          docker build -t crosspaste-rpm-build -f .github/packaging/Dockerfile.rpm .github/packaging
          docker run --rm -e RPM_SIGNING_KEY -v "$GITHUB_WORKSPACE:/workspace" crosspaste-rpm-build

      # The dnf repository that installed RPMs subscribe to (crosspaste.repo
      # points at https://oss.crosspaste.com/site/rpm/). It is generated into
      # the update-site snapshot so the staging step below ships it with the
      # rest of the site: the RPMs under packages/rpm/, repodata/ and the
      # public key under meta/rpm/. Only the current release is listed.
      - name: Build dnf repository
        run: |
          docker run --rm -e RPM_SIGNING_KEY -v "$GITHUB_WORKSPACE:/workspace" crosspaste-rpm-build \
            .github/scripts/package_rpm_repo.sh output update-site/rpm
          # The container runs as root; hand the repository back to the
          # runner user so the staging step can split it into packages/meta.
          sudo chown -R "$(id -u):$(id -g)" update-site/rpm

      # Installs through the freshly built repository with gpgcheck and
      # repo_gpgcheck on, so a broken signature or repodata fails the build.
      - name: Verify RPM on EL9 and Fedora 44 (x86_64)
        run: |
          for image in \
            quay.io/rockylinux/rockylinux:9.8@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f \
            registry.fedoraproject.org/fedora:44@sha256:1b8544582f974533fb8d9a5d6bf6dc2caf0d977ea54979d5e864a6ffd345c32e; do
            docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -w /workspace "$image" \
              bash -c 'bash .github/scripts/verify_rpm.sh output/*.x86_64.rpm update-site/rpm'
          done

      - name: Build Chrome extension
        run: ./gradlew :web:build

      - name: Package Chrome extension zip
        run: |
          cd web/dist
          zip -r "${{ github.workspace }}/output/crosspaste-chrome-extension-${{ env.VERSION }}.${{ env.REVISION }}.zip" .

      # Multi-arch Linux builds emit the apt repository as an output/debian/
      # directory tree instead of flat files at the site root. Surface the
      # .debs at the top level for the versioned OSS dir and the GitHub
      # Release, then drop the rest of the apt repo from output/: it lives on
      # the update site (already snapshotted above), and its index metadata
      # references debian/-relative paths, so flat copies of it are unusable.
      - name: Flatten Linux debs
        run: |
          if [ -d output/debian ]; then
            find output/debian -type f -name '*.deb' -exec mv -n {} output/ \;
            rm -rf output/debian
          fi

      - name: CheckSum
        run: |
          rm -f icon.svg download.html
          for f in *; do
            if [ -f "$f" ]; then shasum -a 256 "$f"; fi
          done > checksum.txt
        working-directory: ./output

      - name: Setup ossutil
        id: setup_ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: "oss-cn-shenzhen.aliyuncs.com"
          access-key-id: ${{ secrets.ALIYUN_ACCESSKEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESSKEY_SECRET }}

      - name: Upload release app
        id: upload_release_app
        run: |
          echo "Uploading release app to OSS..."
          ossutil cp -r output/ oss://crosspaste-desktop/${{ env.VERSION }}.${{ env.REVISION }}/

      # Stage the Conveyor site to a version-named staging prefix (#4629). The
      # build never touches the live site/ prefix that clients poll for
      # updates: publish-release.yml copies staging to site/ when the GitHub
      # Release is published (build is build, publish is publish). The
      # packages/meta split is preserved so the publish step can copy packages
      # first and flip metadata last, and Cache-Control is stamped per group
      # here: packages are version-named and immutable, everything with a
      # fixed name (update metadata, but also download.html, the exe stub,
      # the cert and the icon, all rewritten per release) must revalidate
      # quickly through the CDN and browser caches.
      - name: Stage update site to OSS staging
        run: |
          mkdir update-site-meta
          for f in metadata.properties appcast-*.rss crosspaste.appinstaller \
                   InRelease Release Packages Packages.xz install.ps1 \
                   download.html icon.svg crosspaste.exe crosspaste.crt; do
            if compgen -G "update-site/$f" > /dev/null; then
              mv update-site/$f update-site-meta/
            fi
          done
          # Multi-arch builds nest the apt repository under debian/, and the
          # dnf repository lives under rpm/. Their index metadata (and the
          # RPM public key) must also revalidate quickly, while the
          # version-named .debs and .rpms inside stay immutable, so split
          # them the same way.
          for repo in debian rpm; do
            if [ -d "update-site/$repo" ]; then
              (cd update-site && find "$repo" -type f ! -name '*.deb' ! -name '*.rpm') | while read -r f; do
                mkdir -p "update-site-meta/$(dirname "$f")"
                mv "update-site/$f" "update-site-meta/$f"
              done
            fi
          done
          # Drop any marker left by a previous run of this version first, so a
          # re-run never exposes a "complete" flag over a half-re-uploaded
          # staging prefix (|| true: the marker usually doesn't exist yet).
          ossutil rm -f oss://crosspaste-desktop/site-staging/${{ env.VERSION }}.${{ env.REVISION }}/staging-complete || true
          ossutil cp -r -f --meta "Cache-Control:public, max-age=2592000" update-site/ oss://crosspaste-desktop/site-staging/${{ env.VERSION }}.${{ env.REVISION }}/packages/
          ossutil cp -r -f --meta "Cache-Control:public, max-age=300" update-site-meta/ oss://crosspaste-desktop/site-staging/${{ env.VERSION }}.${{ env.REVISION }}/meta/
          # Written last: publish-release.yml refuses to publish a staging
          # prefix that lacks this marker (i.e. an unfinished upload).
          echo "${{ env.VERSION }}.${{ env.REVISION }}" > staging-complete
          ossutil cp -f staging-complete oss://crosspaste-desktop/site-staging/${{ env.VERSION }}.${{ env.REVISION }}/staging-complete

      # conveyor default cache directory is .conveyor/cache
      # Avoid caching it, causing Github space payment
      - name: Cleanup Conveyor
        if: always()
        run: |
          rm -f developerID_application.p12
          rm -rf AuthKey.p8
          rm -rf .conveyor/cache/*

      - name: Display file tree with sizes
        run: |
          echo "Displaying the size of files and directories in 'output' directory:"
          du -ah output | sort -rh

      # delete output directory to free up space, Github Action only has 14G space,
      # to avoid the failure of insufficient space in the subsequent post recycling steps
      - name: Delete output directory
        run: rm -rf output
