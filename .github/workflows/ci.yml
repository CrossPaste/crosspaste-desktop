name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) instead of
# letting them all run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      cli: ${{ steps.filter.outputs.cli }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'shared/**'
              - 'core/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'compose-stability.conf'
              - '.github/workflows/ci.yml'
            # The cli module has no project dependencies (pure Kotlin/Native HTTP
            # client), so core/shared changes cannot affect it — only its own
            # sources and the shared build configuration trigger this gate.
            cli:
              - 'cli/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'core/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'

  app-build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_FULL_PLATFORM: YES
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      # Replaces the hand-rolled ~/.gradle actions/cache: entries are scoped per
      # job (app-build and web-build no longer race to save one shared key, which
      # let web-build's ~34 MB cache shadow app-build's full one), stale entries
      # are still restored when a dependency bump changes the key, and writes only
      # happen on main, so merges seed the cache that PRs consume.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache JetBrains Runtime JDK
        uses: actions/cache@v5
        with:
          path: ./app/jbr
          key: jbr-${{ hashFiles('**/jbr.yaml') }}

      # The Kotlin/Native toolchain dependencies (gcc sysroot, llvm, lldb, libffi)
      # are downloaded and extracted into ~/.konan on every run otherwise.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # The committed gradle.properties targets modest dev machines; the public
      # ubuntu-latest runner has 4 vCPUs / 16 GB RAM. The last value of a property
      # wins, so local dev keeps the committed settings.
      - name: Right-size Gradle for the hosted runner
        run: |
          {
            echo ""
            echo "# CI-only overrides"
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx4g"
            echo "org.gradle.parallel=true"
          } >> gradle.properties

      - name: Build common modules and desktop app
        run: ./gradlew :core:build :shared:build :app:build

  # Compile gate for the CLI native binary, split from app-build so the two run
  # in parallel and app-only PRs skip the ~3 min Kotlin/Native build entirely.
  # The release links for linuxArm64 and mingwX64 guard the cross-compilation
  # path build-release.yml depends on (its ubuntu job cross-compiles both
  # before Conveyor packaging).
  cli-build:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The Kotlin/Native toolchain dependencies (gcc sysroot, llvm, lldb, libffi)
      # are downloaded and extracted into ~/.konan on every run otherwise.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Right-size Gradle for the hosted runner
        run: |
          {
            echo ""
            echo "# CI-only overrides"
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx4g"
            echo "org.gradle.parallel=true"
          } >> gradle.properties

      - name: Build CLI native binary
        run: >
          ./gradlew :cli:ktlintCheck :cli:cliNativeTest :cli:linkDebugExecutableLinuxX64
          :cli:linkReleaseExecutableLinuxArm64 :cli:linkReleaseExecutableMingwX64

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build web extension
        run: ./gradlew :web:build

      - name: Test web extension
        working-directory: web
        run: npm test

  ci:
    needs: [app-build, cli-build, web-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify CI results
        run: |
          app_result="${{ needs.app-build.result }}"
          cli_result="${{ needs.cli-build.result }}"
          web_result="${{ needs.web-build.result }}"
          echo "app-build: $app_result"
          echo "cli-build: $cli_result"
          echo "web-build: $web_result"
          for result in "$app_result" "$cli_result" "$web_result"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI failed"
              exit 1
            fi
          done
          echo "CI passed"
